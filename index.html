<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>N Project</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- LOADER -->
  <div id="loader" class="loader-wrapper">
    <div class="heart-loader">💖</div>
  </div>

  <!-- DARK MODE BUTTON -->
  <button class="dark-btn" onclick="darkMode()">🌙 Dark Mode</button>

  <!-- LOGIN PAGE -->
  <div id="loginPage" class="login-container">
    <div class="glass login-box">
      <h1 class="letter">N</h1>
      <h2>Xush Kelibsiz ✨</h2>
      <input type="text" id="username" placeholder="Login (N)">
      <input type="password" id="password" placeholder="Parol (1234)">
      <button onclick="login()" class="btn">Kirish</button>
      <p id="errorMsg" class="error"></p>
    </div>
  </div>

  <!-- HOME PAGE -->
  <div id="homePage" class="home-container" style="display: none;">
    <div class="glass home-card">
      <h1 class="main-title">N Project 💖</h1>
      
      <!-- SOAT BLOKI -->
      <div class="glass clock-box">
        <h3 id="clock">00:00:00</h3>
        <p id="date">01-yanvar, 2026</p>
      </div>

      <!-- ⏳ COUNTDOWN TIMER -->
      <div class="glass countdown-box">
        <h3>⏳ Maxsus sanagacha:</h3>
        <div class="timer-display">
          <div class="time-card"><span id="days">00</span><small>Kun</small></div>
          <div class="time-card"><span id="hours">00</span><small>Soat</small></div>
          <div class="time-card"><span id="minutes">00</span><small>Daqiqa</small></div>
          <div class="time-card"><span id="seconds">00</span><small>Sekund</small></div>
        </div>
      </div>

      <!-- 💌 RANDOM NOTES -->
      <div class="glass note-box">
        <h3>💌 Maxsus Xabar</h3>
        <p id="noteText">Tugmani bosing va yurakdan chiqqan so‘zlarni o‘qing... ✨</p>
        <button onclick="generateNote()" class="btn note-btn">✨ Yangi xat o‘qish</button>
      </div>

      <!-- GALEREYA -->
      <div class="gallery-title">📸 Galereya</div>
      <div class="gallery">
        <div class="img-card"><img src="https://picsum.photos/300/300?random=1" alt="Image 1"></div>
        <div class="img-card"><img src="https://picsum.photos/300/300?random=2" alt="Image 2"></div>
        <div class="img-card"><img src="https://picsum.photos/300/300?random=3" alt="Image 3"></div>
      </div>

      <!-- MUSIQA PLEYERI -->
      <div class="glass audio-box">
        <p>🎵 Fon Musiqasi</p>
        <audio id="bgMusic" controls loop>
          <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
          Brauzeringiz audio elementni qo'llab-quvvatlamaydi.
        </audio>
      </div>

      <button onclick="logout()" class="btn logout-btn">Chiqish</button>
    </div>
  </div>

  <script src="script.js"></script>
  <script src="effects.js"></script>
  <script src="darkmode.js"></script>
</body>
</html>
